# Example only. Create the real secret with `kubectl create secret ...`
# and never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: kavachio-secrets
  namespace: kavachio
type: Opaque
stringData:
  # EXTERNAL / managed PostgreSQL. Host "postgres" resolves via the ExternalName
  # Service in postgres.yaml; put the managed DB's real user/password here.
  DATABASE_URL: postgresql+psycopg2://<user>:<password>@postgres:5432/kavachio
  JWT_SECRET: change-me
  GEMINI_API_KEY: ""
