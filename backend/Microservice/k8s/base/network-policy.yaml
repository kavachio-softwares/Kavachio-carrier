# Only the gateway may receive outside traffic; services talk to each other
# inside the namespace. PostgreSQL is EXTERNAL (managed) - reached as egress via
# the "postgres" ExternalName alias; this ingress-only policy does not restrict it.
# If you later add an egress policy, allow the managed DB's CIDR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-external
  namespace: kavachio
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}        # allow same-namespace traffic
