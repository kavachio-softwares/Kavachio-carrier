apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: kavachio
  labels: { app: ingestion-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingestion-service }
  template:
    metadata:
      labels: { app: ingestion-service }
    spec:
      containers:
        - name: ingestion-service
          image: kavachio/ingestion-service:latest
          ports:
            - containerPort: 8003
          envFrom:
            - secretRef: { name: kavachio-secrets }
          env:
            - name: SERVICE_PORT
              value: "8003"
          readinessProbe:
            httpGet: { path: /health/db, port: 8003 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: kavachio
spec:
  selector: { app: ingestion-service }
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-service
  namespace: kavachio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
